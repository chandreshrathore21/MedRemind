name: medicine_reminder
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.0
  provider: ^6.1.2
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher" # Updated to match standard Android default (@mipmap/ic_launcher)
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#004D40"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/